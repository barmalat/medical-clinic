databaseChangeLog:
  - changeSet:
      id: 4
      author: barmalat
      changes:
        - createTable:
            tableName: facility
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_facility_id
              - column:
                  name: facility_name
                  type: varchar(255)
                  constraints:
                    unique: true
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false